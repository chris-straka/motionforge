# Checks from AGENTS.md. The Rust job runs on Linux x86_64 and macOS
# arm64 so the byte-for-byte CLI goldens also pin cross-platform
# determinism (platform libm drift broke them once; see detmath.rs).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo build --locked --release --offline
      - run: cargo test --locked --release --offline

  # Headless Blender: the extension end-to-end against the real CLI
  # (export/import, every operator, BVH batch -> manifest gate).
  blender:
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "5.2.1"
      BLENDER_SERIES: "5.2"
    steps:
      - uses: actions/checkout@v5
      - name: Build CLI
        working-directory: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --release --offline
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v5
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxi6 \
            libxrender1 libxxf86vm1 libxfixes3 libsm6 libice6
      - name: Headless extension test
        run: ~/blender/blender --background --factory-startup --python blender/tests/test_headless.py
      - name: Batch retarget pipeline test
        env:
          MF_REQUIRE_BLENDER: "1"
        run: BLENDER=~/blender/blender python3 -m unittest -v blender.tests.test_batch

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Stdlib-only suites (torch-dependent training is local-only).
      - run: python3 -m unittest discover -s blender/tests -p "test_pure.py"
      - run: python3 -m unittest discover -s python/tests -p "test_*.py"
      - run: python3 -m unittest discover -s tools/tests -p "test_*.py"
