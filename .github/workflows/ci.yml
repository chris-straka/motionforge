# Checks from AGENTS.md. The Rust job runs on Linux x86_64 and macOS
# arm64 so the byte-for-byte CLI goldens also pin cross-platform
# determinism (platform libm drift broke them once; see detmath.rs).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo build --locked --release --offline
      - run: cargo test --locked --release --offline

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib-only suites (torch-dependent training is local-only).
      - run: python3 -m unittest discover -s blender/tests -p "test_pure.py"
      - run: python3 -m unittest discover -s python/tests -p "test_*.py"
      - run: python3 -m unittest discover -s tools/tests -p "test_*.py"
